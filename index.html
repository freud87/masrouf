<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masrouf – Ferid & Saber</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#1a2634;--mu:#5a6b7c;--ac:#2d7fc1;--bd:#dce1e8;--hd:#eef2f7;--ok:#0e5c2b;--okb:#d1f0d6;--rd:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#1a1f2e;--tx:#e2e8f2;--mu:#7f93b5;--ac:#5aaae0;--bd:#2a3044;--hd:#1f2740;--ok:#4ec97a;--okb:#0d2e1a;--rd:#e07070}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;padding:8px}
header{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:8px 12px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
h1{font-size:17px}h3{font-size:13px;margin-bottom:6px;border-bottom:2px solid var(--ac);padding-bottom:4px}
.badge{font-size:12px;font-weight:700;color:var(--ac);cursor:pointer;background:none;border:1.5px solid var(--ac);padding:5px 12px}
.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.card{background:var(--card);border-radius:10px;padding:12px;flex:1 1 320px;min-width:0}
.card.big{flex:2 1 520px}
label{display:block;font-size:12px;font-weight:600;margin:6px 0 2px}
input,select{width:100%;padding:8px;border:1.5px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:15px}
button{padding:8px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:var(--mu)}button.rd{background:var(--rd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 7px;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--hd)}
td.n{text-align:right}
.concl td{background:var(--okb);color:var(--ok);font-weight:700;text-align:center}
#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts button{flex:1}
.mu{color:var(--mu);font-size:11px;margin-top:6px}
.hidden{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
.modal.hidden{display:none}
.modal .box{background:var(--card);padding:20px;border-radius:12px;text-align:center}
.modal h3{border:0;margin-bottom:14px}
.modal .row{gap:14px}
.modal button{padding:14px 24px;font-size:15px}
.modal .userbtn{padding:10px 16px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;color:var(--tx);border:2px solid var(--bd)}
.modal .userbtn img{width:64px;height:64px;border-radius:50%;object-fit:cover;pointer-events:none}
.modal .userbtn:hover{border-color:var(--ac)}
</style>
</head>
<body>

<div id="userModal" class="modal hidden">
  <div class="box">
    <h3>Qui est-ce ?</h3>
    <div class="row">
      <button class="userbtn" onclick="setUser('Ferid')"><img src="ferico.png" alt="Ferid">Ferid</button>
      <button class="userbtn" onclick="setUser('Saber')"><img src="sabico.png" alt="Saber">Saber</button>
    </div>
  </div>
</div>

<header>
  <h1>💸 Masrouf : Ferid &amp; Saber</h1>
  <button class="badge" id="who" onclick="ouvrirModaleUser()">--</button>
</header>

<div class="wrap">
  <section class="card">
    <h3 id="ft">Nouvelle dépense</h3>
    <div class="row">
      <div><label>Date</label><input type="date" id="date"></div>
      <div><label>Type</label><select id="type"><option value="maison">Maison</option><option value="baba">Baba</option><option value="ommi">Ommi</option></select></div>
    </div>
    <div id="fF">
      <div class="row"><div><label>Dépense Ferid (DT)</label><input type="number" step="0.001" id="ferid"></div><div><label>Tickets</label><input type="number" id="tickets"></div></div>
      <label>Argent donné à Saber (DT)</label><input type="number" step="0.001" id="ferToSab">
    </div>
    <div id="fS">
      <label>Dépense Saber (DT)</label><input type="number" step="0.001" id="saber">
      <label>Argent donné à Ferid (DT)</label><input type="number" step="0.001" id="sabToFer">
    </div>
    <div class="acts"><button id="bs" onclick="save()">Enregistrer</button><button class="sec" id="bc" style="display:none" onclick="reset()">Annuler</button></div>

    <h3 style="margin-top:14px">Récapitulation</h3>
    <div class="tw"><table><thead><tr><th>Indicateur</th><th>Ferid</th><th>Saber</th></tr></thead><tbody id="recap"></tbody></table></div>
  </section>

  <section class="card big">
    <h3>Historique</h3>
    <div class="tw"><table><thead><tr><th>Jour</th><th>Date</th><th>Type</th><th>Ferid</th><th>Tickets</th><th>Saber</th><th>Fer➔Sab</th><th>Sab➔Fer</th><th>Éditeur</th><th></th></tr></thead><tbody id="hist"></tbody></table></div>
    <p class="mu" id="mode"></p>
  </section>
</div>
<div id="msg"></div>

<script>
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const TYPE_LABELS={maison:'Maison',baba:'Baba',ommi:'Ommi'};
const LS='masrouf_v2', LSU='masrouf_user';
// Valeur d'un ticket, fixée dans le code (pas de champ dédié dans l'interface)
const VALEUR_TICKET=3;
// URL du Web App Apps Script (voir Code.gs)
const API_URL='https://script.google.com/macros/s/AKfycbxsPr9CIVA49-Y6XYQHctj_2L7gnFxf8b-u_hQ0Cb7CbGNalhqRwUUKu5LhD1ZQvqat/exec';
let rows=[], user='', editId=null;

const $=id=>document.getElementById(id);
const num=v=>parseFloat(String(v==null?'':v).replace(/[\s\u00A0\u202F]/g,'').replace(',','.'))||0;
const fmt=n=>n.toFixed(3).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const jourDe=d=>d?JOURS[new Date(d+'T00:00:00').getDay()]:'-';
const dfr=d=>d?d.split('-').reverse().join('/'):'-';
let toastTimer=null;
function toast(t,permanent){
  const m=$('msg');
  if(toastTimer){clearTimeout(toastTimer);toastTimer=null}
  m.textContent=t;m.style.display='block';
  if(!permanent)toastTimer=setTimeout(()=>{m.style.display='none'},2500);
}

/* ---------- stockage local (repli hors-ligne) ---------- */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS));if(d)rows=d.rows||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({rows}))}catch(e){}}

/* ---------- appels au Web App ---------- */
async function appel(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  return d;
}
async function load(){
  try{
    const r=await fetch(API_URL+'?t='+Date.now());
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    rows=d.rows||[];
    saveLocal();$('mode').textContent='Connecté au Web App.';render();
  }catch(e){$('mode').textContent='Hors ligne / erreur de connexion — données locales affichées.';render()}
}
async function persistRow(r){
  try{const d=await appel({action:'upsert',row:r,utilisateur:user});rows=d.rows;saveLocal();render();return}
  catch(e){toast('Écriture distante impossible, sauvegarde locale');}
  const i=rows.findIndex(x=>x.id===r.id);i<0?rows.push(r):rows[i]=r;saveLocal();render();
}
async function removeRow(id){
  try{const d=await appel({action:'delete',id:id,utilisateur:user});rows=d.rows;saveLocal();render();return}
  catch(e){toast('Suppression distante impossible : '+e.message);}
  rows=rows.filter(x=>x.id!==id);saveLocal();render();
}

/* ---------- calcul du récap ---------- */
function calcul(){
  const M={F:0,S:0,tk:0}, P={F:0,S:0,tk:0}; // P = Baba + Ommi (même répartition 50/50)
  let fs=0,sf=0;
  rows.forEach(r=>{
    const t=r.type==='maison'?M:P, tk=num(r.tickets)*VALEUR_TICKET;
    t.tk+=tk; t.F+=num(r.ferid)+tk; t.S+=num(r.saber);
    fs+=num(r.ferToSab); sf+=num(r.sabToFer);
  });
  const totM=M.F+M.S, totP=P.F+P.S;
  const partF=totM*2/3+totP/2, partS=totM/3+totP/2;
  const credit=(M.F+P.F-partF)+fs-sf; // >0 : Saber doit à Ferid
  const a=Math.abs(credit);
  const concl=a<0.0005?'Comptes équilibrés':credit>0?`Saber doit ${fmt(a)} DT à Ferid`:`Ferid doit ${fmt(a)} DT à Saber`;
  return {M,P,partF,partS,concl};
}

/* ---------- rendu ---------- */
function render(){
  const c=calcul();
  const L=(a,b,cc)=>`<tr><td>${a}</td><td class="n">${b}</td><td class="n">${cc}</td></tr>`;
  $('recap').innerHTML=
    L('Valeur tickets maison',fmt(c.M.tk),'')+
    L('Valeur tickets parents',fmt(c.P.tk),'')+
    L('Tot dépenses maison',fmt(c.M.F),fmt(c.M.S))+
    L('Tot dépenses parents',fmt(c.P.F),fmt(c.P.S))+
    L('Parts dépenses',fmt(c.partF),fmt(c.partS))+
    `<tr class="concl"><td style="text-align:left">Conclusion</td><td colspan="2">${c.concl}</td></tr>`;
  const sorted=[...rows].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(a.id||'').localeCompare(b.id||''));
  $('hist').innerHTML=sorted.length?'':'<tr><td colspan="10" style="text-align:center;padding:14px;color:var(--mu)">Aucune dépense.</td></tr>';
  sorted.forEach(r=>{
    const tr=document.createElement('tr');
    const own=r.editeur===user;
    tr.innerHTML=`<td><b>${jourDe(r.date)}</b></td><td>${dfr(r.date)}</td><td>${r.type?(TYPE_LABELS[r.type]||'Maison'):'-'}</td>
      <td class="n">${fmt(num(r.ferid))}</td><td class="n">${num(r.tickets)}</td><td class="n">${fmt(num(r.saber))}</td>
      <td class="n">${fmt(num(r.ferToSab))}</td><td class="n">${fmt(num(r.sabToFer))}</td><td>${r.editeur||'-'}</td><td></td>`;
    if(own){
      const td=tr.lastElementChild;
      const b1=document.createElement('button');b1.textContent='✎';b1.style.padding='3px 8px';b1.style.fontSize='12px';b1.onclick=()=>startEdit(r.id);
      const b2=document.createElement('button');b2.textContent='🗑';b2.className='rd';b2.style.padding='3px 8px';b2.style.fontSize='12px';b2.style.marginLeft='4px';
      b2.onclick=async()=>{
        if(!confirm('Supprimer cette dépense ?'))return;
        b2.disabled=true;toast('Suppression en cours...',true);
        await removeRow(r.id);
        toast('Dépense supprimée !');
      };
      td.append(b1,b2);
    }
    $('hist').appendChild(tr);
  });
}

/* ---------- utilisateur ---------- */
function ouvrirModaleUser(){$('userModal').classList.remove('hidden')}
function setUser(n){
  user=n;try{localStorage.setItem(LSU,n)}catch(e){}
  $('who').textContent=n;
  $('fF').style.display=n==='Saber'?'none':'block';
  $('fS').style.display=n==='Ferid'?'none':'block';
  $('userModal').classList.add('hidden');
  render();
}

/* ---------- formulaire ---------- */
function reset(){
  editId=null;['ferid','tickets','saber','ferToSab','sabToFer'].forEach(i=>$(i).value='');
  $('date').value=new Date().toISOString().slice(0,10);$('type').value='maison';
  $('ft').textContent='Nouvelle dépense';$('bs').textContent='Enregistrer';$('bc').style.display='none';
}
function startEdit(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  editId=id;$('date').value=r.date;$('type').value=r.type||'maison';
  $('ferid').value=r.ferid||'';$('tickets').value=r.tickets||'';$('saber').value=r.saber||'';
  $('ferToSab').value=r.ferToSab||'';$('sabToFer').value=r.sabToFer||'';
  $('ft').textContent='Correction';$('bs').textContent='Corriger';$('bc').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function save(){
  if(!user){toast('Choisissez d\'abord qui vous êtes');ouvrirModaleUser();return}
  const r={id:editId||uid(),date:$('date').value,type:$('type').value,
    ferid:user==='Ferid'?num($('ferid').value):0,tickets:user==='Ferid'?num($('tickets').value):0,
    saber:user==='Saber'?num($('saber').value):0,
    ferToSab:user==='Ferid'?num($('ferToSab').value):0,sabToFer:user==='Saber'?num($('sabToFer').value):0,
    editeur:user};
  if(!r.date){toast('Date manquante');return}
  if(!(r.ferid||r.tickets||r.saber||r.ferToSab||r.sabToFer)){toast('Aucune donnée à enregistrer');return}
  const wasEdit=!!editId;
  const aDepense=r.ferid||r.tickets||r.saber; // dépense = maison/baba/ommi ; sans dépense, le type n'a pas de sens
  r.type=aDepense?$('type').value:'';
  $('bs').disabled=true;
  toast(wasEdit?'Correction en cours...':'Enregistrement en cours...',true);
  await persistRow(r);
  $('bs').disabled=false;
  reset();
  toast(wasEdit?'Dépense corrigée !':'Dépense enregistrée !');
}

/* ---------- démarrage ---------- */
loadLocal();reset();
(function(){
  let u='';try{u=localStorage.getItem(LSU)||''}catch(e){}
  if(u)setUser(u);else ouvrirModaleUser();
})();
render();
load();
setInterval(load,20000);
</script>
</body>
</html>
